audio:
  enabled: true
  output_dir: /downloads/audio

video:
  enabled: true
  output_dir: /downloads/video

artist:
  mode: channel        # "channel" or "custom"
  custom_name: ""      # used when mode is "custom"

discovery:
  youtube_api_key: ""  # YouTube Data API v3 key, required for the Discover tab
  dismissed_ids: []    # video IDs dismissed from the review queue (managed by the app)
  known_djs: []         # DJ names for the Discover dropdown (managed by the app)
  dj_counts: {}          # known_djs name -> set count, shown as "Name (Qty)" (managed by the app)
